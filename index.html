<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Attendance Checker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="card">
    <h1>Student Attendance Checker</h1>
    <p>Enter the student's attendance details to calculate eligibility.</p>

    <form id="attendanceForm">
      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" required>

      <label for="totalClasses">Total Classes</label>
      <input type="number" id="totalClasses" required>

      <label for="attendedClasses">Classes Attended</label>
      <input type="number" id="attendedClasses" required>

      <button type="submit">Check Attendance</button>

      <button type="button" id="resetButton">Reset</button>
    </form>

    <section id="result" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
</body>

</html>
